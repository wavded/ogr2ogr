name: build
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-full-latest
      options: --user 1001
    strategy:
      matrix:
        node: ["22", "24", "26"]
    name: Node v${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: npm pack
      - name: Test packaged conversion on Node.js
        run: |
          mkdir /tmp/ogr2ogr-smoke
          cd /tmp/ogr2ogr-smoke
          npm install "$GITHUB_WORKSPACE"/ogr2ogr-*.tgz
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import {ogr2ogr} from "ogr2ogr"

          let input = {type: "FeatureCollection", features: []}
          let result = await ogr2ogr(input)
          assert.equal(result.data.type, input.type)
          assert.deepEqual(result.data.features, input.features)
          JS
